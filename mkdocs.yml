site_name: Microscope for Salesforce
docs_dir: docs
exclude_docs: |
  skills/shared/objects
  skills/shared/examples/invocations
  skills/shared/examples/services

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - toc.integrate

markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - About Microscope: MicroscopeAbout.md
  - Solution: MicroscopeSolution.md
  - Security: MicroscopeSecurity.md
  - Installation: installation/MicroscopeInstallation.md
  - Developer Guide: MicroscopeDeveloperGuide.md



  - Resources:
    - Downloads:
      - Solution PDF:downloads/microscope-pdf.md
      - Skills ZIP:downloads/microscope-skills.md
    - Skills Library:
      - Create Absent Connection Stub: skills/microscope-create-absent-connection-stub/SKILL.md
      - Create Absent Service Stub: skills/microscope-create-absent-service-stub/SKILL.md
      - Create Down Status Stub: skills/microscope-create-down-status-stub/SKILL.md
      - Create Scratch Stub: skills/microscope-create-scratch-stub/SKILL.md
      - New Apex Invocation: skills/microscope-new-apex-invocation/SKILL.md
      - New Implementation Version: skills/microscope-new-implementation-version/SKILL.md
      - New Invocation Record: skills/microscope-new-invocation-record/SKILL.md
      - New Method Setup: skills/microscope-new-method-setup/SKILL.md
      - New Method Version: skills/microscope-new-method-version/SKILL.md
      - New Pilot: skills/microscope-new-pilot/SKILL.md
      - Refactor Invocable Action Apex: skills/microscope-refactor-invocable-action-apex/SKILL.md
      - Refactor Method: skills/microscope-refactor-method/SKILL.md
