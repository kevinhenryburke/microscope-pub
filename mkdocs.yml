site_name: Microscope for Salesforce
docs_dir: docs
exclude_docs: |
  skills/shared/objects
  skills/shared/examples/invocations
  skills/shared/examples/services

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - toc.integrate

markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - About Microscope: MicroscopeAbout.md
  - Solution: MicroscopeSolution.md
  - Security: MicroscopeSecurity.md
  - Installation: installation/MicroscopeInstallation.md
  - Developer Guide: MicroscopeDeveloperGuide.md



  - Resources:
    - Downloads:
      - Solution PDF: downloads/microscope-pdf.md
      - Skills ZIP: downloads/microscope-skills.md
    - Skills Library:
      - Create Absent Connection Stub:
        - README: skills/microscope-create-absent-connection-stub/README.md
        - SKILL: skills/microscope-create-absent-connection-stub/SKILL.md
      - Create Absent Service Stub:
